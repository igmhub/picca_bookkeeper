# update names in [metal-matrix]
# increased time limit for picca_dmat

delta extraction:
  calib: 1
  calib region: ciii
  extra args:
    picca_delta_extraction:
      general:
        data:
          type: DesiHealpix
          lambda min: 3600
          lambda max: 5772
          wave solution: lin
          delta lambda: 0.8
          minimum number pixels in forest: 150
        expected flux:
          type: Dr16FixedFudgeExpectedFlux
          fudge value: 0
          var lss mod: 7.5
          limit var lss: (0, 0.4)
      ciii:
        expected flux:
          var lss mod: 1
      lya:
        data:
          lambda max rest frame: 1205.0
  slurm args:
    picca_convert_transmission:
      general:
        time: '03:30:00'
        qos: regular
        cpus-per-task: 256
    picca_delta_extraction:
      general:
        time: '03:30:00'
        qos: regular
        cpus-per-task: 256
      ciii:
        time: '04:00:00'
        cpus-per-task: $
      lya:
        time: '02:30:00'
      lyb:
        time: '01:10:00'
correlations:
  fast metals: true
  extra args:
    picca_cf:
      general:
        rp-min: 0
        rp-max: 200
        rt-max: 200
        np: 50
        nt: 50
        fid-Or: 7.963e-05
        fid-Om: 0.315
        rebin-factor: 3
    picca_dmat:
      general:
        rej: 0.99
        rp-min: 0
        rp-max: 300
        rt-max: 200
        np: 75
        nt: 50
        fid-Or: 7.963e-05
        fid-Om: 0.315
        rebin-factor: 3
        coef-binning-model: 2
    picca_fast_metal_dmat:
      general:
        abs-igm: SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)
        rp-min: 0
        rp-max: 300
        rt-max: 200
        np: 75
        nt: 50
        fid-Or: 7.963e-05
        fid-Om: 0.315
        rebin-factor: 3
        coef-binning-model: 2
    picca_metal_dmat:
      general:
        rej: 0.999
        abs-igm: SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)
        rp-min: 0
        rp-max: 300
        rt-max: 200
        np: 75
        nt: 50
        fid-Or: 7.963e-05
        fid-Om: 0.315
        rebin-factor: 3
        coef-binning-model: 1
      lyaciv_lyaciv:
        abs-igm: CIV(eff)
    picca_xcf:
      general:
        mode: desi_healpix
        nside: 16
        rp-min: -200
        rp-max: 200
        rt-max: 200
        np: 100
        nt: 50
        fid-Or: 7.963e-05
        fid-Om: 0.315
        rebin-factor: 3
      lyalya_lyalyb:
        smooth-per-r-par: ''
    picca_xdmat:
      general:
        mode: desi_healpix
        rej: 0.99
        nside: 16
        rp-min: -300
        rp-max: 300
        rt-max: 200
        np: 150
        nt: 50
        fid-Or: 7.963e-05
        fid-Om: 0.315
        rebin-factor: 3
        coef-binning-model: 2
    picca_fast_metal_xdmat:
      general:
        mode: desi_healpix
        abs-igm: SiII(1190) SiII(1193) SiIII(1207) SiII(1260)
        rp-min: -300
        rp-max: 300
        rt-max: 200
        np: 150
        nt: 50
        fid-Or: 7.963e-05
        fid-Om: 0.315
        rebin-factor: 3
        coef-binning-model: 2
      lyaciv:
        abs-igm: CIV(eff)
    picca_metal_xdmat:
      general:
        mode: desi_healpix
        rej: 0.999
        abs-igm: SiII(1190) SiII(1193) SiIII(1207) SiII(1260)
        rp-min: -300
        rp-max: 300
        rt-max: 200
        np: 150
        nt: 50
        fid-Or: 7.963e-05
        fid-Om: 0.315
        rebin-factor: 3
        coef-binning-model: 1
    picca_export:
      lyalya_lyalya:
        blind-corr-type: lyaxlya
      lyalya_lyalyb:
        blind-corr-type: lyaxlyb
        smooth-per-r-par: ''
      qso_lyalya:
        blind-corr-type: qsoxlya
      lyalyb:
        blind-corr-type: qsoxlyb
  slurm args:
    picca_cf:
      general:
        qos: regular
        time: '01:30:00'
        cpus-per-task: 256
      lyalya_lyalya:
        time: '00:50:00'
      lyalya_lyalyb:
        time: '00:30:00'
    picca_dmat:
      general:
        qos: regular
        time: '12:00:00'
        cpus-per-task: 128
      lyalya_lyalya:
        time: '12:00:00'
        OMP_NUM_THREADS: 1
      lyalya_lyalyb:
        time: '06:00:00'
    picca_export:
      general:
        qos: regular
        time: '00:15:00'
        cpus-per-task: 1
    picca_fast_metal_dmat:
      general:
        qos: regular
        time: '00:20:00'
        cpus-per-task: 128
    picca_metal_dmat:
      general:
        qos: regular
        time: '12:00:00'
        cpus-per-task: 128
    picca_xcf:
      general:
        qos: regular
        time: '01:00:00'
        cpus-per-task: 256
      qso_lyalya:
        time: '01:00:00'
      lyalyb:
        time: '00:30:00'
    picca_xdmat:
      general:
        qos: regular
        time: '02:00:00'
        cpus-per-task: 128
      qso_lyalya:
        time: '02:00:00'
      qso_lyalyb:
        time: '01:00:00'
    picca_fast_metal_xdmat:
      general:
        qos: regular
        ime: '00:10:00'
        cpus-per-task: 128
    picca_metal_xdmat:
      general:
        qos: regular
        time: '12:00:00'
        cpus-per-task: 128
fits:
  auto correlations: lya.lya-lya.lya lya.lya-lya.lyb
  cross correlations: qso-lya.lya qso-lya.lyb
  compute covariance: true
  smooth covariance: true
  compute zeff: false
  vega metals: true
  no bao: false
  no hcd: false
  no metals: false
  no sky: false
  no qso rad: false
  rmin cf:
  rmax cf:
  rmin xcf:
  rmax xcf:
  extra args:
    smooth_covariance:
      general:
        correlation-types: auto auto cross cross
    vega_auto:
      general:
        cuts:
          rp-min: -300.0
          rp-max: 300.0
          rt-min: 0.0
          rt-max: 300.0
          r-min: 30.0
          r-max: 200.0
          mu-min: -1.0
          mu-max: 1.0
        model:
          z evol LYA: bias_vs_z_std
          small scale nl: dnl_arinyo
          use_metal_autos: true
          desi-instrumental-systematics: true
          model-hcd: Rogers2018
          fast_metals: true
          new_metals: true
          rp_only_metal_mats: false
          skip-nl-model-in-peak: true
          UVB-fluctuations: true
          UVB-shotnoise: false
          marginalize-below-rtmax: 0
          marginalize-below-rpmax: 0
          marginalize-above-rtmin: 0
          marginalize-above-rpmin: 0
          marginalize-all-rmin-cuts: true
          fit-marginalized-scales: true
          marginalize-match-data-bins: true
        metals:
          filename: None
          z evol: bias_vs_z_std
          in tracer1: SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)
          in tracer2: SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)
        metal-matrix:
          rebin_factor: 3
          weight_evol_LYA: 2.9
          z_ref_objects: 2.25
          weight_evol_QSO.: 1.44
          z_bins_objects: 1000
      lyaciv_lya_civ:
        metals:
          in tracer1: CIV(eff)
          in tracer2: CIV(eff)
      lyaciv:
        metals:
          in tracer2: CIV(eff)
    vega_cross:
      general:
        cuts:
          rp-min: -300.0
          rp-max: 300.0
          rt-min: 0.0
          rt-max: 300.0
          r-min: 40.0
          r-max: 200.0
          mu-min: -1.0
          mu-max: 1.0
        model:
          z evol LYA: bias_vs_z_std
          z evol QSO: bias_vs_z_std
          UVB-fluctuations: true
          model-hcd: Rogers2018
          fast_metals: true
          new_metals: true
          rp_only_metal_mats: false
          velocity dispersion: lorentz
          radiation effects: true
          marginalize-below-rtmax: 0
          marginalize-below-rpmax: 0
          marginalize-above-rtmin: 0
          marginalize-above-rpmin: 0
          marginalize-all-rmin-cuts: true
          fit-marginalized-scales: true
          marginalize-match-data-bins: true
          skip-nl-model-in-peak: true
        metals:
          filename: None
          z evol: bias_vs_z_std
          in tracer1: SiII(1190) SiII(1193) SiIII(1207) SiII(1260) CIV(eff)
          velocity dispersion: lorentz
        metal-matrix:
          rebin_factor: 3
          weight_evol_LYA: 2.9
          z_ref_objects: 2.25
          weight_evol_QSO.: 1.44
          z_bins_objects: 1000
    vega_main:
      general:
        data sets:
          zeff: 2.33
        cosmo-fit type:
          cosmo fit func: phi_alpha
          full-shape: false
          full-shape-alpha: false
          smooth-scaling: true
        fiducial:
          filename: Planck18/DESI-2024_z_2.33.fits
        output:
          filename: combined.fits
          overwrite: true
        sample:
          growth_rate: true
          bias_LYA: true
          beta_LYA: true
          bias_QSO: true
          sigma_velo_disp_lorentz_QSO: true
          drp_QSO: true
          qso_rad_strength: true
          bias_hcd: true
          beta_hcd: 0.0 3.0 0.7 0.1
          L0_hcd: 0.0 10.0 6.51 0.1
          bias_SiII(1190): true
          bias_SiII(1193): true
          bias_SiIII(1207): true
          bias_SiII(1260): true
          bias_CIV(eff): true
          desi_inst_sys_amp: true
          bias_gamma: true
          phi: true
          alpha: true
          phi_smooth: true
          alpha_smooth: true
        priors:
          bias_CIV(eff): gaussian -0.019 0.005
          drp_QSO: gaussian 0.0 1.0
          beta_hcd: gaussian 0.5 0.09
          L0_hcd: gaussian 5.0 2.0
        parameters:
          sigmaNL_per: 3.24
          sigmaNL_par: 6.36984
          bao_amp: 1.0
          bias_LYA: -0.11629442782749021
          beta_LYA: 1.67
          alpha_LYA: 2.9
          bias_QSO: 3.792183285869361
          bias_eta_QSO: 1
          growth_rate: 0.9674624900622072
          alpha_QSO: 1.44
          bias_gamma: 0.1125
          bias_prim: -0.66
          lambda_uv: 300
          uv_shotnoise_amp: 0
          dnl_arinyo_q1: 0.303
          dnl_arinyo_q2: 0.267
          dnl_arinyo_kv: 0.576
          dnl_arinyo_av: 0.443
          dnl_arinyo_bv: 1.66
          dnl_arinyo_kp: 11.062
          bias_hcd: -0.05
          beta_hcd: 0.5
          L0_hcd: 5.0
          drp_QSO: 0.0
          sigma_velo_disp_lorentz_QSO: 6.86
          qso_rad_strength: 0.74
          qso_rad_asymmetry: 0.0
          qso_rad_lifetime: 9e99
          qso_rad_decrease: 300.0
          bias_SiII(1190): -0.0052
          beta_SiII(1190): 0.5
          alpha_SiII(1190): 1.0
          bias_SiII(1193): -0.0024
          beta_SiII(1193): 0.5
          alpha_SiII(1193): 1.0
          bias_SiIII(1207): -0.0074
          beta_SiIII(1207): 0.5
          alpha_SiIII(1207): 1.0
          bias_SiII(1260): -0.0046
          beta_SiII(1260): 0.5
          alpha_SiII(1260): 1.0
          bias_CIV(eff): -0.019
          beta_CIV(eff): 0.5
          alpha_CIV(eff): 0.0
          # alpha_CIV(eff): 1.0 # new value?
          desi_inst_sys_amp: 1e-4
          phi: 1.0
          alpha: 1.0
          phi_smooth: 1.0
          alpha_smooth: 1.0
        control:
          sampler: true
          use_template_growth_rate: false
          marginalize-in-fit: false
          low_mem_mode: false
        Polychord:
          seed: 2
          num_live: 512
          num_repeats: 25
          path:
          name: com
          do_clustering: true
          resume: true
          boost_posterior: 3
    run_vega_mpi:
      general:
        init-limit: 32
  slurm args:
    run_vega:
      general:
        qos: shared
        ntasks: 1
        time: '00:45:00'
        cpus-per-task: 20
    run_vega_mpi:
      general:
        time: '06:00:00'
        nodes: 8
        ntasks-per-node: 64
    picca_bookkeeper_correct_config_zeff:
      general:
        qos: shared
        ntasks: 1
        time: '00:04:00'
        cpus-per-task: 5
    write_full_covariance:
      general:
        qos: regular
        time: '00:05:00'
        cpus-per-task: 256
    smooth_covariance:
      general:
        qos: shared
        time: '00:30:00'
        cpus-per-task: 5
